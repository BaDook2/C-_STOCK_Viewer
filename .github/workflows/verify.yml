name: Verify desktop apps without publishing

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desktop:
    name: Verify ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run regressions
        run: |
          dotnet build StockViewer.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet StockViewer.Tests/bin/Release/net10.0/StockViewer.Tests.dll
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed.' }
      - name: Verify real native popup handles
        run: |
          dotnet StockViewer.Tests/bin/Release/net10.0/StockViewer.Tests.dll --native --ui-only
          if ($LASTEXITCODE -ne 0) { throw 'Native window checks failed.' }
      - name: Verify packaged Mac desktop observer
        if: runner.os == 'macOS'
        env:
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          $version = (Get-Content .github/release-version).Trim()
          python3 scripts/publish_macos.py --version $version --runtime $env:RELEASE_RUNTIME --output artifacts/verify-package
          if ($LASTEXITCODE -ne 0) { throw 'macOS package failed.' }
          python3 scripts/smoke_macos.py --version $version --runtime $env:RELEASE_RUNTIME --directory artifacts/verify-package
          if ($LASTEXITCODE -ne 0) { throw 'macOS startup or native module verification failed.' }
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UI-checks-${{ matrix.runtime }}
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
