name: Release Windows EXE
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify single EXE
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version and commit
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use an existing version tag such as v1.0.0.'
          }
          $taskTagCommit = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The version tag does not exist.' }
          $taskHead = git rev-parse HEAD
          if ($taskHead -ne $taskTagCommit) { throw 'Checkout does not match the release tag.' }
          "tag=$env:RELEASE_TAG" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "version=$($env:RELEASE_TAG.Substring(1))" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore StockViewer.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

      - name: Build Release
        run: |
          dotnet build StockViewer.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run offline regression checks
        run: |
          dotnet StockViewer.Tests/bin/Release/net10.0-windows/StockViewer.Tests.dll
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed.' }

      - name: Publish standalone Windows x64 EXE
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release -SkipRootCopy

      - name: Verify EXE-only startup
        run: |
          $ErrorActionPreference = 'Stop'
          $taskSmokeDirectory = Join-Path $env:RUNNER_TEMP "StockViewer-exe-only-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $taskSmokeDirectory -Force | Out-Null
          $taskExecutable = Join-Path $taskSmokeDirectory 'StockViewer.exe'
          Copy-Item -LiteralPath release/StockViewer.exe -Destination $taskExecutable
          $taskProcess = Start-Process -FilePath $taskExecutable -WorkingDirectory $taskSmokeDirectory -WindowStyle Hidden -PassThru
          try {
            if ($taskProcess.WaitForExit(5000)) {
              throw "The standalone EXE exited unexpectedly: $($taskProcess.ExitCode)"
            }
          } finally {
            if (-not $taskProcess.HasExited) { Stop-Process -Id $taskProcess.Id -Force }
          }
          (Get-FileHash -LiteralPath release/StockViewer.exe -Algorithm SHA256).Hash | Write-Output

      - name: Upload verified EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StockViewer-windows-x64
          path: release/StockViewer.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WPF-diagnostics
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download verified EXE
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: StockViewer-windows-x64
          path: release

      - name: Attach EXE to versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $taskHash = (Get-FileHash -LiteralPath release/StockViewer.exe -Algorithm SHA256).Hash
          $taskNotes = @"
          Windows x64용 STOCK MINI입니다.

          Assets의 StockViewer.exe 하나만 다운로드하여 실행하세요.
          별도 설치, .NET 설치, 증권사 API 키가 필요하지 않습니다.
          공개 시세 조회를 위한 인터넷 연결은 필요합니다.

          기본 확인 주기는 2초이며 제공처가 지정한 더 긴 갱신 간격을 우선합니다.

          SHA-256: $taskHash
          "@
          $taskNotes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG release/StockViewer.exe --repo $env:GH_REPO --verify-tag --title "STOCK MINI $env:RELEASE_TAG" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed. Existing published versions are not overwritten.' }
