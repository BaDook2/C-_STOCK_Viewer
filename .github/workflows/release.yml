name: Release Windows and macOS
run-name: Release ${{ inputs.tag || github.ref_name }}

'on':
  push:
    branches: [main]
    paths: ['.github/release-version']
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, or leave empty to release the version in .github/release-version'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, xml.etree.ElementTree as ET
          version = pathlib.Path('.github/release-version').read_text().strip()
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Invalid release version')
          tag = os.environ.get('REQUESTED_TAG') or (os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else 'v' + version)
          if tag != 'v' + version or ET.parse('StockViewer.App/StockViewer.App.csproj').findtext('.//Version') != version:
              raise SystemExit('Tag, project and release manifest must have the same version')
          if not pathlib.Path('docs/releases/' + tag + '.md').is_file():
              raise SystemExit('Release notes are missing')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.run(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], capture_output=True, text=True)
          if tagged.returncode == 0 and tagged.stdout.strip() != commit:
              raise SystemExit('Existing version tag points to another commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\ncommit={commit}\n')
          PY

  build:
    name: Build and verify ${{ matrix.runtime }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: |
          dotnet restore StockViewer.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build StockViewer.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Run headless regressions
        run: |
          dotnet StockViewer.Tests/bin/Release/net10.0/StockViewer.Tests.dll
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed.' }
      - name: Run native window checks
        run: |
          dotnet StockViewer.Tests/bin/Release/net10.0/StockViewer.Tests.dll --native --ui-only
          if ($LASTEXITCODE -ne 0) { throw 'Native window checks failed.' }
      - name: Publish Windows standalone EXE
        if: runner.os == 'Windows'
        run: ./Publish.ps1 -Version $env:RELEASE_VERSION -Runtime win-x64 -OutputDirectory release -SkipRootCopy
      - name: Verify EXE-only startup
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $taskSmokeDirectory = Join-Path $env:RUNNER_TEMP "StockViewer-exe-only-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $taskSmokeDirectory -Force | Out-Null
          $taskExecutable = Join-Path $taskSmokeDirectory 'StockViewer.exe'
          Copy-Item -LiteralPath release/StockViewer.exe -Destination $taskExecutable
          $taskProcess = Start-Process -FilePath $taskExecutable -WorkingDirectory $taskSmokeDirectory -WindowStyle Hidden -PassThru
          try {
            if ($taskProcess.WaitForExit(5000)) { throw "Standalone EXE exited unexpectedly: $($taskProcess.ExitCode)" }
            $taskLogsDirectory = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'StockViewer/logs'
            $taskLogFiles = @(Get-ChildItem -LiteralPath $taskLogsDirectory -Filter "stockviewer-*-$($taskProcess.Id)-*.jsonl")
            $taskLoggedStartup = $false
            foreach ($taskLogFile in $taskLogFiles) {
              $taskRecord = Get-Content -LiteralPath $taskLogFile.FullName -TotalCount 1 | ConvertFrom-Json
              if ($taskRecord.event -eq 'session.started' -and $taskRecord.data.version -in @($env:RELEASE_VERSION, "$env:RELEASE_VERSION.0")) {
                $taskLoggedStartup = $true
              }
            }
            if (-not $taskLoggedStartup) { throw 'Standalone EXE did not write its versioned startup diagnostic.' }
            Write-Output 'PASS: standalone EXE created its startup diagnostic in the default log directory'
          } finally {
            if (-not $taskProcess.HasExited) { Stop-Process -Id $taskProcess.Id -Force }
          }
      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          python3 scripts/publish_macos.py --version $env:RELEASE_VERSION --runtime $env:RELEASE_RUNTIME --output release
          if ($LASTEXITCODE -ne 0) { throw 'macOS package failed.' }
      - name: Verify extracted macOS app startup
        if: runner.os == 'macOS'
        env:
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          python3 scripts/smoke_macos.py --runtime $env:RELEASE_RUNTIME --version $env:RELEASE_VERSION --directory release
          if ($LASTEXITCODE -ne 0) { throw 'macOS bundle startup failed.' }
      - name: Upload verified binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.runtime }}
          path: |
            release/StockViewer.exe
            release/StockViewer-macOS-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UI-${{ matrix.runtime }}
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish Windows and Mac downloads
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish verified release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          (cd release && sha256sum StockViewer.exe StockViewer-macOS-arm64.zip StockViewer-macOS-x64.zip > SHA256SUMS.txt)
          cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          printf '\nSHA-256:\n\n```text\n' >> release-notes.md
          cat release/SHA256SUMS.txt >> release-notes.md
          printf '```\n' >> release-notes.md
          gh release create "$RELEASE_TAG" release/StockViewer.exe release/StockViewer-macOS-arm64.zip release/StockViewer-macOS-x64.zip release/SHA256SUMS.txt --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title "StockViewer $RELEASE_TAG" --notes-file release-notes.md --latest
